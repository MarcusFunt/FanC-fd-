# Generated smoke config for an end-to-end OpenFOAM pipeline run.
fan:
  name: codex_openfoam_smoke
  max_diameter_m: 0.120
  hub_diameter_m: 0.030
  rpm: 5000.0

  stages:
    - name: rotor_1
      type: rotor
      axial_position_m: 0.0
      blade_count: 5
      rpm: 5000.0
      rotation_direction: counterclockwise
      blade:
        airfoil: naca4412
        radial_sections: 9
        chord_profile:
          type: linear
          points:
            - [0.0, 0.030]
            - [1.0, 0.020]
        twist_profile_deg:
          type: linear
          points:
            - [0.0, 42.0]
            - [1.0, 18.0]
        thickness_scale: 1.0

cfd:
  solver: simpleFoam
  rotation_model: MRF
  turbulence_model: kOmegaSST

  inlet:
    patch_name: inlet
    velocity_m_s: 5.0
    turbulence_intensity: 0.05
    hydraulic_diameter_m: 0.12

  outlet:
    patch_name: outlet
    velocity_m_s: 5.0
    turbulence_intensity: 0.05
    hydraulic_diameter_m: 0.12

  fluid:
    nu_m2_s: 1.5e-5
    rho_kg_m3: 1.225

  mesh:
    base_cell_size_m: 0.020
    refinement_levels: 1
    boundary_layers: 0
    boundary_layer_expansion: 1.2
    domain_length_factor: 2.0
    n_processors: 4

  run:
    n_iterations: 20
    write_interval: 10
    convergence_residual: 1.0e-4
    parallel: false
    n_procs: 4
    purge_write: 1

objective:
  mode: single
  maximize: efficiency
  constraints:
    min_pressure_rise_pa: 10.0
