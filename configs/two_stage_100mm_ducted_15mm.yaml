# two_stage_100mm_ducted_15mm.yaml
# ==================================
# Two rotor-stator stages in a duct.
# Assumptions:
# - 100 mm is the blade-tip diameter.
# - Rotor/stator "height" is represented as 15 mm blade chord/axial depth.
#
# Layout, inlet to outlet:
#   R1 @ 10 mm, S1 @ 32 mm, R2 @ 55 mm, S2 @ 78 mm

fan:
  name: two_stage_100mm_ducted_15mm
  max_diameter_m: 0.100
  hub_diameter_m: 0.025
  rpm: 5000.0

  duct:
    enabled: true
    inner_diameter_m: 0.102
    wall_thickness_m: 0.003
    total_length_m: 0.100
    inlet_clearance_m: 0.010
    outlet_clearance_m: 0.007

  stages:
    - name: rotor_1
      type: rotor
      axial_position_m: 0.010
      blade_count: 7
      rpm: 5000.0
      rotation_direction: counterclockwise
      blade:
        airfoil: naca4412
        radial_sections: 11
        chord_profile:
          type: constant
          value: 0.015
        twist_profile_deg:
          type: linear
          points:
            - [0.0, 38.0]
            - [1.0, 18.0]
        thickness_scale: 1.0

    - name: stator_1
      type: stator
      axial_position_m: 0.032
      blade_count: 9
      blade:
        airfoil: naca0012
        radial_sections: 11
        chord_profile:
          type: constant
          value: 0.015
        twist_profile_deg:
          type: linear
          points:
            - [0.0, -28.0]
            - [1.0, -12.0]
        thickness_scale: 0.9

    - name: rotor_2
      type: rotor
      axial_position_m: 0.055
      blade_count: 7
      rpm: 5000.0
      rotation_direction: counterclockwise
      blade:
        airfoil: naca4412
        radial_sections: 11
        chord_profile:
          type: constant
          value: 0.015
        twist_profile_deg:
          type: linear
          points:
            - [0.0, 34.0]
            - [1.0, 16.0]
        thickness_scale: 1.0

    - name: stator_2
      type: stator
      axial_position_m: 0.078
      blade_count: 9
      blade:
        airfoil: naca0012
        radial_sections: 11
        chord_profile:
          type: constant
          value: 0.015
        twist_profile_deg:
          type: linear
          points:
            - [0.0, -24.0]
            - [1.0, -10.0]
        thickness_scale: 0.9

cfd:
  solver: simpleFoam
  rotation_model: MRF
  turbulence_model: kOmegaSST

  inlet:
    patch_name: inlet
    velocity_m_s: 5.0
    turbulence_intensity: 0.05
    hydraulic_diameter_m: 0.102

  outlet:
    patch_name: outlet
    velocity_m_s: 5.0
    turbulence_intensity: 0.05
    hydraulic_diameter_m: 0.102

  fluid:
    nu_m2_s: 1.5e-5
    rho_kg_m3: 1.225

  mesh:
    base_cell_size_m: 0.003
    refinement_levels: 3
    boundary_layers: 5
    boundary_layer_expansion: 1.2
    domain_length_factor: 4.0
    n_processors: 4

  run:
    n_iterations: 1000
    write_interval: 100
    convergence_residual: 1.0e-4
    parallel: false
    n_procs: 4
    purge_write: 1

objective:
  mode: single
  maximize: efficiency
  constraints:
    min_pressure_rise_pa: 20.0
