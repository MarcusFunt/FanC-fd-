# jetengine_inspired_axial_compressor.yaml
# =======================================
# Axial compressor preset inspired by Afshawn's public jetengine example:
# https://afshawn.org/jetengine/main.html
#
# The reference mean-line run reports a 1.3 kg/s, 15,000 RPM, PR 1.5
# compressor with 6 stages, free-vortex circular-arc blades, 24-28 blades per
# row, and roughly 14-16 mm chord. FanC(fd) currently uses one global annulus,
# so this config preserves the row stack, blade counts, chord taper, inlet
# velocity, and stagger/twist ranges while using supported NACA sections.

fan:
  name: jetengine_inspired_axial_compressor
  max_diameter_m: 0.164536
  hub_diameter_m: 0.082268
  rpm: 15000.0

  duct:
    enabled: true
    inner_diameter_m: 0.166536
    wall_thickness_m: 0.004
    total_length_m: 0.310
    inlet_clearance_m: 0.020
    outlet_clearance_m: 0.020

  stages:
    - name: rotor_1
      type: rotor
      axial_position_m: 0.020000
      blade_count: 24
      rpm: 15000.0
      rotation_direction: counterclockwise
      blade:
        airfoil: naca2412
        radial_sections: 13
        chord_profile:
          type: constant
          value: 0.016258
        twist_profile_deg:
          type: linear
          points:
            - [0.0, -7.531]
            - [1.0, -54.330]
        thickness_scale: 1.35

    - name: stator_1
      type: stator
      axial_position_m: 0.044258
      blade_count: 24
      blade:
        airfoil: naca0012
        radial_sections: 13
        chord_profile:
          type: constant
          value: 0.016258
        twist_profile_deg:
          type: linear
          points:
            - [0.0, 31.987]
            - [1.0, 20.547]
        thickness_scale: 1.15

    - name: rotor_2
      type: rotor
      axial_position_m: 0.068515
