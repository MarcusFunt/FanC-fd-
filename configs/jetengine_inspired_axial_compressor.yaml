cfd:
  solver: simpleFoam
  rotation_model: MRF
  turbulence_model: kOmegaSST

  inlet:
    patch_name: inlet
    velocity_m_s: 70.0
    turbulence_intensity: 0.05
    hydraulic_diameter_m: 0.084268

  outlet:
    patch_name: outlet
    velocity_m_s: 70.0
    turbulence_intensity: 0.05
    hydraulic_diameter_m: 0.084268

  fluid:
    nu_m2_s: 1.5e-5
    rho_kg_m3: 1.204

  mesh:
    base_cell_size_m: 0.004
    refinement_levels: 4
    boundary_layers: 6
    boundary_layer_expansion: 1.2
    domain_length_factor: 3.0
    n_processors: 8

  run:
    n_iterations: 1200
    write_interval: 100
    convergence_residual: 1.0e-4
    parallel: false
    n_procs: 8
    purge_write: 1

objective:
  mode: multi_objective
  maximize: pressure_rise
  weights:
    pressure_rise: 0.65
    efficiency: 0.35
  constraints:
    min_pressure_rise_pa: 50000.0
    min_flow_rate_m3_s: 1.0
