[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "parametric-fan-cfd"
version = "0.1.0"
description = "Parametric fan blade generator and OpenFOAM CFD optimization pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "parametric-fan-cfd contributors" }]
keywords = ["CFD", "fan", "OpenFOAM", "turbomachinery", "optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "trimesh>=4.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.scripts]
fan-generate = "scripts.generate_geometry:main"
fan-run = "scripts.run_case:main"
fan-optimize = "scripts.optimize:main"
fan-postprocess = "scripts.postprocess_case:main"
fan-render = "scripts.render_screen:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fan_cfd*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:invalid value encountered in divide:RuntimeWarning:trimesh.triangles",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
